stages:
  - build

benchmark-build-docker:
  stage: build
  image: docker:latest
  timeout: 1h
  services: 
    - docker:dind
  tags:
    - docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: 1

  before_script:
    - echo "$GL_PAT" | docker login -u "oauth2" --password-stdin docker-registry.inesctec.pt

  script:
    - docker pull "$CI_REGISTRY_IMAGE" || true
    - docker build --secret id=gl_pat,env=GL_PAT --provenance=false --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from "$CI_REGISTRY_IMAGE" -t "$CI_REGISTRY_IMAGE" -f resources/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE"

  rules:
    - if: '$CI_COMMIT_BRANCH'